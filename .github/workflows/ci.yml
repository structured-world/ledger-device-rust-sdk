name: Run cargo clippy, cargo fmt, build and Unit+Integration tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      name:
        description: 'Manually triggered'
      rust_sdk_branch:
        description: 'Git branch or tag of the Rust SDK to use for this run'
        required: true
        type: string
      c_sdk_branch:
        description: 'Git branch or tag of the Ledger C SDK to use for this run'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  clippy:
    name: Run static analysis
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ledgerhq/ledger-app-builder/ledger-app-dev-tools:latest
    strategy:
      matrix:
        target: ["nanox", "nanosplus", "stax", "flex", "apex_p"]
        package: [include_gif, testmacro, ledger_secure_sdk_sys, ledger_device_sdk]
    steps:
      - name: Clone
        uses: actions/checkout@v6
      - name: Cargo clippy
        working-directory: ${{ matrix.package }}
        run: |
          cargo clippy --target ${{ matrix.target }} -- -D warnings

  format:
    name: Check code formatting
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ledgerhq/ledger-app-builder/ledger-app-dev-tools:latest
    steps:
      - name: Clone
        uses: actions/checkout@v6
      - name: Run cargo fmt
        run: |
          cargo fmt --all --check

  build:
    name: Build SDK
    if: github.event_name != 'workflow_dispatch'
    uses: ./.github/workflows/reusable_build_sdk.yml
    with:
      rust_sdk_branch: ${{ github.ref }}

  build_manual:
    name: Build SDK (manual)
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/reusable_build_sdk.yml
    with:
      rust_sdk_branch: ${{ inputs.rust_sdk_branch }}
      c_sdk_branch: ${{ inputs.c_sdk_branch }}

  test:
    name: Run unit and integration tests
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ledgerhq/ledger-app-builder/ledger-app-dev-tools:latest
    strategy:
      matrix:
        target: ["nanox", "nanosplus", "stax", "flex", "apex_p"]
    steps:
      - name: Clone
        uses: actions/checkout@v6
      - name: Unit tests
        working-directory: ledger_device_sdk
        run: |
          cargo test --target ${{ matrix.target }} --features unit_test --tests

  test-pqc:
    name: Run ML-KEM and ML-DSA unit tests
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ledgerhq/ledger-app-builder/ledger-app-dev-tools:latest
    strategy:
      matrix:
        target: ["nanox", "nanosplus", "stax", "flex", "apex_p"]
    steps:
      - name: Clone
        uses: actions/checkout@v6
      - name: ML-KEM and ML-DSA unit tests
        working-directory: ledger_device_sdk
        # No HEAP_SIZE: the build script picks the Nano X default for PQ crypto.
        run: |
          cargo test --target ${{ matrix.target }} --features unit_test,mlkem,mldsa --tests

  test-app-storage:
    name: Run application storage unit tests
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ledgerhq/ledger-app-builder/ledger-app-dev-tools:latest
    strategy:
      matrix:
        target: ["nanox", "nanosplus", "stax", "flex", "apex_p"]
        # Each property feature on its own, so a lost or swapped header bit fails a run, and
        # both together.
        features:
          - "app_storage"
          - "app_storage_settings"
          - "app_storage_data"
          - "app_storage_settings,app_storage_data"
        # The default capacity, and a custom APP_STORAGE_SIZE to check that it reaches the
        # C side and the bounds.
        size: ["default", "1024"]
        exclude:
          - features: "app_storage_settings"
            size: "1024"
          - features: "app_storage_data"
            size: "1024"
          - features: "app_storage_settings,app_storage_data"
            size: "1024"
    steps:
      - name: Clone
        uses: actions/checkout@v6
      # The storage initialization status needs a C SDK whose app_storage_init() calls
      # app_storage_callback() (LedgerHQ/ledger-secure-sdk#1744), which no released C SDK has:
      # the image's own C SDK (v27.1.2, API level 27) with that change on top, pinned by commit.
      - name: C SDK with app_storage_callback
        env:
          C_SDK_COMMIT: 0190c5022297bb0d25ff943f24c9c6eff66e5bc0
        run: |
          git init -q /tmp/c_sdk
          git -C /tmp/c_sdk fetch -q --depth 1 https://github.com/structured-world/ledger-secure-sdk.git "$C_SDK_COMMIT"
          git -C /tmp/c_sdk checkout -q --detach FETCH_HEAD
          echo "LEDGER_SDK_PATH=/tmp/c_sdk" >> "$GITHUB_ENV"
      - name: Application storage unit tests
        working-directory: ledger_device_sdk
        run: |
          if [ "${{ matrix.size }}" != "default" ]; then
            export APP_STORAGE_SIZE=${{ matrix.size }}
          fi
          cargo test --target ${{ matrix.target }} --features unit_test,${{ matrix.features }} --tests

  build-apps:
    name: Build all Rust apps
    if: github.event_name != 'workflow_dispatch'
    uses: ./.github/workflows/reusable_build_all_apps.yml
    with:
      rust_sdk_branch: ${{ github.ref }}

  build-apps_manual:
    name: Build all Rust apps (manual)
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/reusable_build_all_apps.yml
    with:
      rust_sdk_branch: ${{ inputs.rust_sdk_branch }}
      c_sdk_branch: ${{ inputs.c_sdk_branch }}
